name: Verify McpGo
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Run cross-platform tests on available Linux hosts: macOS runner queues
    # can leave every push untested. Native SwiftUI is separately checked
    # by the signed macOS release builder and optional manual workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Playwright MCP
        working-directory: playwright
        run: npm ci --no-audit --no-fund
      - name: Install zsh for macOS-compatible launcher syntax tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
      - name: Python and onboarding regression
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s onboarding/tests -v
          python3 -m unittest discover -s onboarding -p test_extension_probe_mode.py -v
          python3 -m unittest discover -s messaging/tests -v
          python3 tools/generate_source_inventory.py --check
      - name: Node MCP regression
        run: |
          # GitHub Linux images have no zsh dotfiles. Without this, interactive
          # PTY tests hit zsh-newuser-install instead of executing their command.
          # This changes only the ephemeral CI runner, never user shell settings.
          if [ ! -e "$HOME/.zshrc" ]; then printf '# McpGo CI zsh initialized\n' > "$HOME/.zshrc"; fi
          (cd autosend && node --test tests/*.test.mjs)
          node --test dashboard/tests/*.test.mjs playwright/tests/*.test.mjs
          node --test playwright/probe.test.mjs
          node --test terminal/tests/*.test.cjs terminal/tests/*.test.mjs
          node --check terminal/interactive_runtime.cjs
          node --check terminal/stateless_server.js
          node --check dashboard/server.mjs
          node --check autosend/server.mjs
          node --check playwright/restricted-proxy.mjs
      - name: Launcher and installer syntax
        run: |
          bash -n scripts/launch-macos.sh playwright/start.sh playwright/start-tunnel.sh
          python3 -m py_compile scripts/setup_macos.py onboarding/cli.py onboarding/setup_engine.py
          python3 -c "import plistlib; plistlib.load(open('native/Info.plist','rb')); print('Info.plist OK')"

  # Mac-only SwiftUI compilation can be requested explicitly. Normal pushes
  # remain verified even while hosted macOS capacity is unavailable.
  macos-ui-typecheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SwiftUI compile check
        run: |
          xcrun swiftc -parse-as-library -typecheck \
            -sdk "$(xcrun --show-sdk-path)" \
            -target arm64-apple-macosx14.0 \
            native/main.swift native/Messaging.swift native/TunnelSettings.swift \
            native/TunnelHelp.swift native/InteractiveButtonStyle.swift \
            native/SkillsView.swift native/ScheduledMessages.swift native/OnboardingView.swift
